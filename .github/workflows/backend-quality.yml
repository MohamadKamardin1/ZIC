name: Backend quality

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: ci-only-secret-value-with-more-than-fifty-characters-for-checks
      DEBUG: "False"
      DATABASE_URL: sqlite:///ci.sqlite3
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      EMAIL_HOST: localhost
      EMAIL_HOST_USER: ci@example.com
      EMAIL_HOST_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/development.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements/development.txt
      - name: Django system checks
        run: python manage.py check
      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run
      - name: Backend tests
        run: pytest
      - name: Ruff
        working-directory: .
        run: ruff check backend/apps/common backend/apps/core
      - name: Mypy shared foundation
        working-directory: .
        run: mypy
